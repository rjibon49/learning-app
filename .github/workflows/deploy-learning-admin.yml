name: Deploy Learning Admin CMS

# Same pattern as deploy-learning-api.yml:
# GitHub only checks the code, then asks the VPS (over SSH, restricted user)
# to run one fixed root script. No secrets or source are copied from here.
on:
  push:
    branches:
      - main
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-learning-admin.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-admin-production
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p apps/admin/tsconfig.json

      - name: Lint
        run: npm --workspace @learning/admin run lint

      - name: Build
        env:
          LEARNING_API_URL: https://learning-api.mochiflix.com/api
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm --workspace @learning/admin run build

  deploy:
    name: Deploy Admin CMS to VPS
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.LEARNING_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LEARNING_VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.LEARNING_VPS_HOST }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          for name in DEPLOY_KEY KNOWN_HOSTS VPS_HOST; do
            if [ -z "${!name}" ]; then
              echo "ERROR: secret for $name is empty"
              exit 1
            fi
          done

          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/learning_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/learning_deploy_key" "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/learning_deploy_key" > /dev/null
          if ! ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null; then
            echo "ERROR: No host key entry matches LEARNING_VPS_HOST"
            exit 1
          fi

      - name: Deploy Learning Admin
        env:
          VPS_HOST: ${{ secrets.LEARNING_VPS_HOST }}
        run: |
          set -euo pipefail
          # The script receives the exact commit to deploy; it checks that
          # the commit is on origin/main before building.
          ssh \
            -i "$HOME/.ssh/learning_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            learningdeploy@"$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-learning-admin $GITHUB_SHA"

      # The real health gate is on the VPS: the deploy script waits for the
      # container health check, verifies the running image and rolls back on
      # failure. GitHub runners may be blocked from the CMS (firewall / proxy
      # rules), so this outside check only reports, it never fails the deploy.
      - name: Check live CMS (report only)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://learning-admin.mochiflix.com/admin/login || echo "no-response")
          echo "Live CMS from GitHub runner: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::CMS answered HTTP $code to the GitHub runner. The VPS health check passed; this is usually a firewall or proxy rule for GitHub IPs."
          fi

      - name: Deployment Summary
        if: success()
        run: |
          echo "### Learning Admin CMS Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "CMS: https://learning-admin.mochiflix.com/admin/login" >> "$GITHUB_STEP_SUMMARY"
