
name: Deploy Learning API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "workers/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-learning-api.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Learning API to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.LEARNING_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LEARNING_VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.LEARNING_VPS_HOST }}
        run: |
          set -euo pipefail

          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [ -z "$DEPLOY_KEY" ]; then
            echo "ERROR: SSH private key secret is empty"
            exit 1
          fi

          if [ -z "$KNOWN_HOSTS" ]; then
            echo "ERROR: Known hosts secret is empty"
            exit 1
          fi

          if [ -z "$VPS_HOST" ]; then
            echo "ERROR: VPS host secret is empty"
            exit 1
          fi

          printf '%s\n' "$DEPLOY_KEY" \
            | tr -d '\r' \
            > "$HOME/.ssh/learning_deploy_key"

          printf '%s\n' "$KNOWN_HOSTS" \
            | tr -d '\r' \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/learning_deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "=== SSH Private Key Validation ==="
          ssh-keygen -y \
            -f "$HOME/.ssh/learning_deploy_key" \
            > /dev/null

          echo "=== Known Hosts File Validation ==="
          if ! ssh-keygen -F "$VPS_HOST" \
            -f "$HOME/.ssh/known_hosts" \
            > /dev/null; then
            echo "ERROR: No host key entry matches LEARNING_VPS_HOST"
            exit 1
          fi

          echo "SSH configuration validated"

      - name: Deploy Learning API
        env:
          VPS_HOST: ${{ secrets.LEARNING_VPS_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/learning_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            learningdeploy@"$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-learning-api"

      - name: Deployment Summary
        if: success()
        run: |
          echo "### Learning API Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "API: https://learning-api.mochiflix.com/api/health" >> "$GITHUB_STEP_SUMMARY"
