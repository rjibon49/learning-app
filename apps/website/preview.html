>Listen, then repeat aloud.</p></div><button class="listen-button" data-speak="${esc(l.germanText||l.title)}">${icon('sound',20)} Listen in German</button></div></div><div class="translation-card"><div><div class="eyebrow">ENGLISH TRANSLATION</div><p>${esc(l.englishText||'No English translation provided.')}</p></div><div><div class="eyebrow">বাংলা অনুবাদ</div><p>${esc(l.banglaText||'বাংলা অনুবাদ এখনো যোগ করা হয়নি।')}</p></div></div><div class="lesson-actions"><button class="button ${isDone?'button-outlined':'button-primary'}" data-complete="${esc(l.id)}">${icon('check',17)} ${isDone?'Mark incomplete':'Mark as complete'}</button><div class="lesson-nav">${prev?`<a data-link href="/lessons/${encodeURIComponent(prev.id)}" class="button button-outlined">${icon('left',17)} Previous</a>`:''}${next?`<a data-link href="/lessons/${encodeURIComponent(next.id)}" class="button button-primary">Next lesson ${icon('arrow',17)}</a>`:`<a data-link href="/courses/${encodeURIComponent(c.id)}" class="button button-primary">Back to course ${icon('arrow',17)}</a>`}</div></div></div><aside class="lesson-aside"><div class="aside-heading">IN THIS COURSE</div>${lessons.map((x,i)=>`<a href="/lessons/${encodeURIComponent(x.id)}" data-link class="aside-lesson ${id===x.id?'current':''}"><span class="aside-circle">${state.completed[x.id]?icon('check',14):i+1}</span><span>${esc(x.title)}</span></a>`).join('')}<div class="lesson-aside-tip">${icon('spark',17)} You can revisit any lesson whenever you need a refresher.</div></aside></div>`,'Lesson'); }
function vocabularyPage(){ const words=appWords(),cats=state.categories.filter(c=>c.appId===currentApp()?.id&&c.isActive),filtered=words.filter(w=>(state.category==='all'||w.categoryId===state.category)&&[w.german,w.english,w.bangla,w.article].some(v=>String(v||'').toLowerCase().includes(state.vocabQuery.toLowerCase()))); const shown=filtered.slice(0,state.wordPage*12); return shell(`${heading('MAKE WORDS YOUR SUPERPOWER','Words worth <em>remembering.</em>','Explore German words with English and বাংলা meanings. Tap the speaker icon to hear them out loud.',`<a href="/flashcards" data-link class="button button-primary">Study flashcards ${icon('arrow',18)}</a>`)}<div class="vocab-toolbar"><div class="category-pills"><button data-category="all" class="category-pill ${state.category==='all'?'active':''}">All words <span>${words.length}</span></button>${cats.map(c=>`<button data-category="${esc(c.id)}" class="category-pill ${state.category===c.id?'active':''}">${esc(c.name)}</button>`).join('')}</div><div class="search-field">${icon('search',18)}<input id="vocab-search" type="search" placeholder="Search German, English, বাংলা..." aria-label="Search vocabulary" value="${esc(state.vocabQuery)}" /></div></div><div class="vocab-count">Showing <strong>${shown.length}</strong> of <strong>${filtered.length}</strong> words <span>·</span> ${state.level} ${LEVEL_NAMES[state.level]}</div>${filtered.length?`<div class="vocab-grid">${shown.map((w,i)=>`<article class="vocab-card"><div class="vocab-card-top"><span class="word-no">${String(i+1).padStart(2,'0')}</span><div class="vocab-card-actions"><button class="icon-button ${state.learned[w.id]?'learned':''}" data-master="${esc(w.id)}" aria-label="${state.learned[w.id]?'Unmark':'Mark'} word mastered" title="${state.learned[w.id]?'Mastered':'Mark as mastered'}">${icon(state.learned[w.id]?'check':'bookmark',18)}</button><button class="icon-button" data-speak="${esc(w.german)}" data-audio="${esc(safeURL(w.audioUrl || w.audioAsset?.publicUrl))}" aria-label="Hear ${esc(w.german)}">${icon('sound',19)}</button></div></div>${safeURL(w.imageUrl || w.imageAsset?.publicUrl) ? `<img class="vocab-illustration" loading="lazy" decoding="async" src="${esc(safeURL(w.imageUrl || w.imageAsset?.publicUrl))}" alt="${esc(w.german)}" />` : ''}<div class="word-german">${w.article?`<span>${esc(w.article)}</span> `:''}${esc(w.german)}</div><div class="word-english">${esc(w.english)}</div><div class="word-bangla">${esc(w.bangla)}</div>${w.exampleGerman?`<div class="word-example">“${esc(w.exampleGerman)}”</div>`:''}<div class="vocab-card-footer"><span>${esc(w.category?.name||cats.find(c=>c.id===w.categoryId)?.name||'Vocabulary')}</span><span>${state.learned[w.id]?'<span class="mastered-tag">✓ Mastered</span>':esc(w.difficulty||'EASY')}</span></div></article>`).join('')}</div>${shown.length<filtered.length?'<div class="load-more"><button data-action="more-words" class="button button-outlined">Load more words '+icon('chevron',16)+'</button></div>':''}`:empty('No words found','Try a different search or category. Publish vocabulary in your CMS to populate this section.','vocab')}`,'Vocabulary'); }
function makeQuiz(){const arr=[...appWords()].sort(()=>Math.random()-.5).slice(0,10); const items=arr.filter(w=>!!w.english); return items.map((w,i)=>{ const distractors=appWords().filter(x=>x.id!==w.id&&x.english&&x.english!==w.english).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.english); return { id:w.id, word:w.german, article:w.article, correct:w.english, choices:[...distractors,w.english].sort(()=>Math.random()-.5) }; }).filter(x=>x.choices.length>=2); }
function quizStart(){ state.quiz={questions:makeQuiz(),index:0,selected:null,answers:[],finished:false}; render(); }
function quizPick(index){ if(!state.quiz||state.quiz.selected!==null) return; state.quiz.selected=index; render(); }
function quizNext(){if(!state.quiz||state.quiz.selected===null)return; const q=state.quiz.questions[state.quiz.index]; state.quiz.answers.push(q.choices[state.quiz.selected]===q.correct); if(state.quiz.index===state.quiz.questions.length-1){state.quiz.finished=true;const score=state.quiz.answers.filter(Boolean).length;state.quizBest=Math.max(state.quizBest,Math.round(100*score/state.quiz.questions.length));persist();}else {state.quiz.index++;state.quiz.selected=null;} render();}
function practicePage(){ const words=appWords(),quiz=state.quiz; return shell(`${heading('PRACTICE MAKES PROGRESS','A little practice, <em>a lot of growth.</em>','Turn what you learned into something you remember.')}<div class="practice-layout"><div class="quiz-panel">${!quiz||quiz.questions.length<2?`<div class="quiz-intro"><div class="quiz-mascot">✳</div><div class="eyebrow">READY, SET, LEARN</div><h2>Let's see what<br/>you remember!</h2><p>Take a short, friendly quiz using the published vocabulary for your current level. No pressure, just progress.</p><div class="quiz-info"><span>${icon('cards',17)} Up to 10 words</span><span>${icon('clock',17)} About 3 minutes</span><span>${icon('star',17)} Learn by doing</span></div>${words.length>1?`<button data-action="quiz-start" class="button button-primary button-big">Start practice ${icon('arrow',18)}</button>`:empty('Not enough words yet','Publish at least two vocabulary words to enable a practice quiz.','vocab')}</div>`:quiz.finished?`<div class="quiz-finish"><div class="result-confetti">✷ ✦ ✳</div><div class="score-medal">${icon('trophy',43)}</div><div class="eyebrow">NICE WORK!</div><h2>You got ${quiz.answers.filter(Boolean).length} out of ${quiz.answers.length} right!</h2><p>${Math.round(100*quiz.answers.filter(Boolean).length/quiz.answers.length)}% of your answers were correct. Every attempt brings you closer to fluency.</p><div class="result-progress">${progressBar(Math.round(100*quiz.answers.filter(Boolean).length/quiz.answers.length))}</div><button data-action="quiz-start" class="button button-primary">Practice again ${icon('refresh',18)}</button></div>`:`<div class="quiz-active"><div class="quiz-top"><span>QUESTION ${quiz.index+1} OF ${quiz.questions.length}</span><span>${icon('target',17)} ${quiz.answers.filter(Boolean).length} correct so far</span></div>${progressBar((quiz.index+1)/quiz.questions.length*100)}<div class="eyebrow quiz-subtitle">CHOOSE THE CORRECT ENGLISH MEANING</div><h2>What does <em>“${esc(quiz.questions[quiz.index].article?quiz.questions[quiz.index].article+' ':'')}${esc(quiz.questions[quiz.index].word)}”</em> mean?</h2><button class="quiz-sound" data-speak="${esc(quiz.questions[quiz.index].word)}">${icon('sound',19)} Hear the word</button><div class="quiz-options">${quiz.questions[quiz.index].choices.map((option,i)=>`<button data-answer="${i}" ${quiz.selected!==null?'disabled':''} class="quiz-option ${quiz.selected===i?'picked':''} ${quiz.selected!==null&&option===quiz.questions[quiz.index].correct?'correct':''} ${quiz.selected===i&&option!==quiz.questions[quiz.index].correct?'wrong':''}"><span class="option-letter">${'ABCD'[i]}</span>${esc(option)}<span class="answer-indicator">${quiz.selected!==null&&option===quiz.questions[quiz.index].correct?icon('check',20):''}</span></button>`).join('')}</div>${quiz.selected!==null?`<div class="quiz-feedback">${quiz.questions[quiz.index].choices[quiz.selected]===quiz.questions[quiz.index].correct?'✓ That’s right! Sehr gut!':'The right answer is '+esc(quiz.questions[quiz.index].correct)+'. Keep going!'}</div>`:''}<div class="quiz-bottom"><span>You'll learn something either way.</span><button data-action="quiz-next" class="button button-primary" ${quiz.selected===null?'disabled':''}>${quiz.index===quiz.questions.length-1?'See results':'Next question'} ${icon('arrow',17)}</button></div></div>`}</div><aside class="practice-side"><div class="practice-side-graphic">✦</div><div class="eyebrow">A GENTLE REMINDER</div><h3>Don't aim for perfect. Aim for progress.</h3><p>Making mistakes is part of learning. Showing up is what matters.</p><div class="side-divider"></div><div class="practice-metric">${icon('trophy',20)} Best session <strong>${state.quizBest}%</strong></div><div class="practice-metric">${icon('vocab',20)} Available words <strong>${words.length}</strong></div><p class="side-disclaimer">Practice questions are generated from published vocabulary. CMS quizzes are admin-only in the supplied API.</p></aside></div>`,'Practice zone'); }
function flashcardsPage(){const words=appWords(); if(state.cardIndex>=words.length) state.cardIndex=0; const w=words[state.cardIndex]; return shell(`${heading('YOUR MEMORY GYM','Flip. Remember. <em>Repeat.</em>','Short flashcard sessions help your new words stick. Click or tap a card to reveal the meaning.')}<div class="flash-layout"><div class="flash-main">${w?`<div class="flash-toolbar"><span>WORD ${state.cardIndex+1} OF ${words.length}</span><span>${learnedCount()} MASTERED</span></div>${progressBar((state.cardIndex+1)/words.length*100)}<button class="flashcard ${state.flipped?'flipped':''}" data-action="flip-card" aria-label="Flip flashcard"><div class="flash-glimmer flash-glimmer-one"></div><div class="flash-glimmer flash-glimmer-two"></div><div class="flash-category">${state.flipped?'THE MEANING':'WHAT DOES THIS MEAN?'}</div><div class="flash-word">${state.flipped?esc(w.english):`${w.article?`<small>${esc(w.article)}</small>`:''}${esc(w.german)}`}</div><div class="flash-subword">${state.flipped?esc(w.bangla):'German · '+esc(state.level)}</div><div class="flash-hint">${icon('refresh',17)} Tap to flip</div></button><div class="flash-controls"><button class="flash-circle" aria-label="Previous card" data-action="card-prev">${icon('left',22)}</button><button class="listen-button flash-audio" data-speak="${esc(w.german)}" data-audio="${esc(safeURL(w.audioUrl||w.audioAsset?.publicUrl))}">${icon('sound',19)} Listen</button><button class="flash-circle" aria-label="Next card" data-action="card-next">${icon('right',22)}</button></div><div class="flash-mastery"><button data-master="${esc(w.id)}" class="button ${state.learned[w.id]?'button-outlined':'button-primary'}">${icon('check',17)} ${state.learned[w.id]?'Already mastered ✓':'I know this word'}</button><span>Use ← → to switch cards</span></div>`:empty('Your flashcard deck is empty','Published vocabulary in the current level will become flashcards automatically.','cards')}</div><aside class="flash-side"><div class="flash-side-head"><div class="eyebrow">MY WORDS</div><h3>Keep it going!</h3><p>Every new word is a new little victory.</p></div><div class="flash-side-bubble">✳</div><div class="flash-stat"><strong>${learnedCount()}</strong><span>Words mastered</span></div>${progressBar(words.length?100*learnedCount()/words.length:0)}<div class="flash-small-note">${icon('info',17)} Your mastered words are saved on this device.</div><a data-link href="/vocabulary" class="button button-outlined button-full">Explore vocabulary ${icon('arrow',16)}</a></aside></div>`,'Flashcards'); }
function progressPage(){ const courses=appCourses(),words=appWords(),lessons=appLessons(),done=completedCount(),learned=learnedCount(),learningRate=lessons.length?Math.round(100*done/lessons.length):0; return shell(`${heading('EVERY STEP IS A WIN','Look how far <em>you’ve come.</em>','Your personal progress is saved on this device — keep showing up and watch it grow.')}<div class="progress-stats"><div class="progress-stat-card"><div class="progress-stat-label">COMPLETED LESSONS</div><div class="progress-stat-value">${done} <span>/ ${lessons.length}</span></div>${progressBar(learningRate)}<div class="progress-stat-caption">${learningRate}% through your level</div></div><div class="progress-stat-card"><div class="progress-stat-label">WORDS MASTERED</div><div class="progress-stat-value">${learned} <span>/ ${words.length}</span></div>${progressBar(words.length?learned/words.length*100:0)}<div class="progress-stat-caption">Your personal vocabulary bank</div></div><div class="progress-stat-card accent-stat"><div class="progress-stat-label">PERSONAL BEST QUIZ</div><div class="progress-stat-value">${state.quizBest}<span>%</span></div><span class="stat-comet">✳</span><div class="progress-stat-caption">Keep practising, keep improving</div></div></div><div class="progress-two-col"><div class="progress-courses"><div class="section-head"><div><div class="eyebrow">KEEP UP THE MOMENTUM</div><h2>Course progress</h2></div></div>${courses.length?courses.map((c,i)=>`<a href="/courses/${encodeURIComponent(c.id)}" class="progress-course-row" data-link><div class="progress-course-icon course-icon-${i%4}">${['Aa','✳','ß','✦'][i%4]}</div><div class="progress-course-content"><div><strong>${esc(c.title)}</strong><span>${courseProgress(c.id)}%</span></div>${progressBar(courseProgress(c.id),true)}<small>${lessonsForCourse(c.id).filter(l=>state.completed[l.id]).length} / ${lessonsForCourse(c.id).length} lessons completed</small></div>${icon('right',19)}</a>`).join(''):empty('Nothing to track yet','Courses you publish will appear here.')}</div><div class="achievement-card"><div class="eyebrow">YOUR ACHIEVEMENTS</div><h2>Collect little wins</h2><p>Each milestone is worth celebrating.</p><div class="achievement-list"><div class="achievement-item ${done>=1?'unlocked':''}"><span class="achievement-icon">${icon('star',23)}</span><div><strong>First steps</strong><small>Complete your first lesson</small></div>${done>=1?icon('check',19):icon('lock',17)}</div><div class="achievement-item ${learned>=5?'unlocked':''}"><span class="achievement-icon">${icon('vocab',22)}</span><div><strong>Word collector</strong><small>Master 5 new words</small></div>${learned>=5?icon('check',19):icon('lock',17)}</div><div class="achievement-item ${state.quizBest>=80?'unlocked':''}"><span class="achievement-icon">${icon('trophy',22)}</span><div><strong>Quiz whiz</strong><small>Score 80% on a practice quiz</small></div>${state.quizBest>=80?icon('check',19):icon('lock',17)}</div></div><div class="progress-footnote">${icon('info',16)} Progress is stored locally in your browser, not synced with an account.</div></div></div>`,'My progress'); }
function aboutPage(){return shell(`${heading('HELLO, NICE TO MEET YOU','Learning German, <em>made joyful.</em>','Wortly is a friendly learning experience built on top of your German-learning CMS and API.')}<div class="about-hero"><div><div class="eyebrow">OUR APPROACH</div><h2>Small lessons.<br/>Real confidence.</h2><p>Learn naturally with thoughtfully structured courses, clear vocabulary, helpful Bangla translations and practice that makes words stick.</p><a href="/courses" data-link class="button button-light">Explore courses ${icon('arrow',18)}</a></div><div class="about-art">Hallo<span>✳</span></div></div><div class="about-grid"><div>${icon('book',26)}<h3>Learn your way</h3><p>Structured A1–C1 courses and bite-sized lessons from your CMS.</p></div><div>${icon('sound',26)}<h3>Speak out loud</h3><p>Listen to German words and practice your pronunciation using browser speech or attached audio.</p></div><div>${icon('cards',26)}<h3>Make it stick</h3><p>Turn your vocabulary into flashcards and fun mini quizzes.</p></div></div><div class="about-note">${icon('info',19)} <span>This prototype uses public CMS data where available, with sample content shown only when the backend is offline. Learner login, cloud progress sync, and paid subscriptions are not offered because the supplied API does not expose a corresponding public learner authentication flow.</span></div>`,'About Wortly');}
function render(){ const path=route();let content;
 if(path==='/') content=dashboard();
 else if(path==='/courses') content=coursesPage();
 else if(path.startsWith('/courses/')) content=coursePage(path.slice('/courses/'.length));
 else if(path.startsWith('/lessons/')) content=lessonPage(path.slice('/lessons/'.length));
 else if(path==='/vocabulary') content=vocabularyPage();
 else if(path==='/flashcards') content=flashcardsPage();
 else if(path==='/practice') content=practicePage();
 else if(path==='/progress') content=progressPage();
 else if(path==='/about') content=aboutPage();
 else content=shell(`${heading('404 · NOT FOUND','Looks like you took a detour.')}<p class="page-description">No problem — finding your way is part of learning.</p><a href="/" data-link class="button button-primary">Go back home ${icon('arrow',17)}</a>`,'Not found');
 appEl.innerHTML=content;
 document.title = `${({ '/':'Overview','/courses':'Courses','/vocabulary':'Vocabulary','/flashcards':'Flashcards','/practice':'Practice','/progress':'My progress','/about':'About' })[path]||'Keep learning'} · Wortly`;
}
function speak(text,audioUrl){if(audioUrl){try {const audio=new Audio(audioUrl);audio.play().catch(()=>speak(text));return;}catch{}}if(!('speechSynthesis' in window)){toast('Speech playback is not supported in this browser.');return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.82;window.speechSynthesis.speak(u);}
document.addEventListener('click', e=>{
 const link=e.target.closest('a[data-link]');if(link){e.preventDefault();go(link.getAttribute('href'));return;}
 const button=e.target.closest('button');if(!button)return;
 if(button.dataset.level){state.level=button.dataset.level;state.category='all';state.vocabQuery='';state.courseQuery='';state.cardIndex=0;state.wordPage=1;state.quiz=null;persist();render();return;}
 if(button.dataset.category){state.category=button.dataset.category;state.wordPage=1;render();return;}
 if(button.dataset.master){const id=button.dataset.master;state.learned[id]=!state.learned[id];persist();render();return;}
 if(button.dataset.complete){const id=button.dataset.complete;state.completed[id]=!state.completed[id];persist();render();toast(state.completed[id]?'Lesson complete! Well done ✨':'Lesson marked incomplete.');return;}
 if(button.dataset.lang){state.lessonLang=button.dataset.lang;render();return;}
 if(button.dataset.speak){e.stopPropagation();speak(button.dataset.speak,button.dataset.audio);return;}
 if(button.dataset.answer!==undefined){quizPick(Number(button.dataset.answer));return;}
 switch(button.dataset.action){
  case 'toggle-menu':state.sidebarOpen=!state.sidebarOpen;render();break;
  case 'jump-to-search':go('/vocabulary');document.getElementById('vocab-search')?.focus();break;
  case 'start-learning': {const lesson=appLessons().find(l=>!state.completed[l.id])||appLessons()[0];go(lesson?'/lessons/'+encodeURIComponent(lesson.id):'/courses');break;}
  case 'retry-api':appEl.innerHTML='<div class="boot-loader"><span class="loader-logo">W</span>Reconnecting to your API…</div>';loadData();break;
  case 'more-words':state.wordPage++;render();break;
  case 'flip-card':state.flipped=!state.flipped;render();break;
  case 'card-prev':if(appWords().length){state.cardIndex=(state.cardIndex-1+appWords().length)%appWords().length;state.flipped=false;render();}break;
  case 'card-next':if(appWords().length){state.cardIndex=(state.cardIndex+1)%appWords().length;state.flipped=false;render();}break;
  case 'quiz-start':quizStart();break;
  case 'quiz-next':quizNext();break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='vocab-search'||e.target.id==='course-search'){
 const field=e.target;const sel=field.selectionStart;const val=field.value;
 if(field.id==='vocab-search'){state.vocabQuery=val;state.wordPage=1;}else state.courseQuery=val;
 render();const newField=document.getElementById(field.id);if(newField){newField.focus();try{newField.setSelectionRange(sel,sel);}catch{}}
}});
document.addEventListener('keydown',e=>{if(route()==='/flashcards'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){if(e.key==='ArrowLeft'){state.cardIndex=(state.cardIndex-1+appWords().length)%Math.max(1,appWords().length);state.flipped=false;render();}else if(e.key==='ArrowRight'){state.cardIndex=(state.cardIndex+1)%Math.max(1,appWords().length);state.flipped=false;render();}else if(e.key===' '){e.preventDefault();state.flipped=!state.flipped;render();}}});
loadData();

  </script>
